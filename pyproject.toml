[project]
name = "hashstore"
version = "1.2.0"
description = "HashStore, an object storage system using content identifiers."
authors = [
    { name = "Dou Mok", email = "douming.mok@gmail.com" },
    { name = "Matt Jones", email = "gitcode@magisa.org" },
    { name = "Matthew Brooke" },
    { name = "Jing Tao" },
    { name = "Jeanette Clark" },
    { name = "Ian M. Nesbitt" },
]
requires-python = ">=3.9, <4.0"
readme = "README.md"
keywords = [
    "filesystem",
    "object storage",
    "hashstore",
    "storage",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "pathlib>=1.0.1",
    "pyyaml>=6.0",
]

[project.scripts]
hashstore = "hashstore.hashstoreclient:main"

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "exceptiongroup>=1.1.0",
    "black>=22.10.0",
    "pylint>=2.17.4",
    "pg8000>=1.29.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poetry_bumpversion.file."src/hashstore/__init__.py"]
